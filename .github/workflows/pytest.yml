name: Pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swibit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swibit
          REDIS_URL: redis://localhost:6379/0
          MONGODB_URL: mongodb://localhost:27017/swibit
          LLM_API_KEY: "test-key-fake"
          LLM_BASE_URL: "https://test.com"
        run: |
          cd backend
          python -c "
import sys
from unittest.mock import MagicMock

mock_client = MagicMock()
mock_client.embeddings.create.return_value = MagicMock(
    data=[MagicMock(embedding=[0.1] * 1536)]
)
mock_client.chat.completions.create.return_value = MagicMock(
    choices=[MagicMock(message=MagicMock(content='{\"answer\": \"test\", \"citations\": []}'))]
)

sys.modules['openai'] = MagicMock()
sys.modules['openai'].OpenAI = MagicMock(return_value=mock_client)
sys.modules['redis'] = MagicMock()
sys.modules['motor'] = MagicMock()
sys.modules['motor.motor_asyncio'] = MagicMock()
" && pytest -v